<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" width="1600" height="900">
  <!-- Atmospheric anime cyber-night background.
       Muted, low-contrast on purpose: the dashboard overlay keeps text legible. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a33"/>
      <stop offset="0.45" stop-color="#0a162a"/>
      <stop offset="1" stop-color="#070d1c"/>
    </linearGradient>
    <linearGradient id="moonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd9ff"/>
      <stop offset="0.6" stop-color="#8ea7ff"/>
      <stop offset="1" stop-color="#4a5f8f"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12213f"/>
      <stop offset="1" stop-color="#0d1830"/>
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a33"/>
      <stop offset="1" stop-color="#0a1326"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1527"/>
      <stop offset="1" stop-color="#070f1e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Faint stars -->
  <g fill="#9fb7e8" opacity="0.5">
    <circle cx="180" cy="120" r="1.1"/>
    <circle cx="340" cy="70" r="0.8"/>
    <circle cx="520" cy="180" r="1.0"/>
    <circle cx="690" cy="100" r="0.7"/>
    <circle cx="880" cy="200" r="1.2"/>
    <circle cx="1050" cy="90" r="0.9"/>
    <circle cx="1230" cy="150" r="1.0"/>
    <circle cx="1400" cy="110" r="0.8"/>
    <circle cx="266" cy="250" r="0.6"/>
    <circle cx="760" cy="40" r="0.7"/>
    <circle cx="1120" cy="300" r="0.7"/>
    <circle cx="470" cy="320" r="0.6"/>
    <circle cx="1310" cy="280" r="0.7"/>
  </g>

  <!-- Moon with soft halo -->
  <circle cx="1270" cy="220" r="150" fill="#93a8ff" opacity="0.08"/>
  <circle cx="1270" cy="220" r="92" fill="#93a8ff" opacity="0.12"/>
  <circle cx="1270" cy="220" r="58" fill="url(#moonGlow)" opacity="0.9"/>

  <!-- Far ridge -->
  <path d="M0 430 L140 470 260 430 400 500 560 460 700 520 840 460 990 530 1140 470 1300 540 1460 480 1600 520 L1600 900 L0 900 Z" fill="url(#ridgeFar)" opacity="0.7"/>

  <!-- Mid ridge (mountains) -->
  <path d="M0 540 L120 600 260 560 420 640 600 590 780 660 930 600 1080 670 1260 620 1420 680 1600 640 L1600 900 L0 900 Z" fill="url(#ridgeMid)" opacity="0.85"/>

  <!-- Near ridge -->
  <path d="M0 660 L160 720 320 680 500 760 660 700 820 780 980 720 1140 800 1320 740 1520 820 1600 780 L1600 900 L0 900 Z" fill="url(#ridgeNear)"/>

  <!-- Forest silhouette (evergreens) along the horizon line -->
  <g fill="#060d1a">
    <path d="M40 820 l14 -44 10 44 M74 830 l12 -38 9 38 M120 828 l15 -48 11 48 M170 834 l11 -34 8 34 M220 826 l16 -50 12 50 M280 832 l13 -40 9 40 M340 830 l14 -44 10 44 M410 836 l15 -46 11 46 M480 828 l12 -36 9 36 M560 834 l16 -48 12 48 M650 830 l13 -40 10 40 M740 836 l14 -44 11 44 M830 828 l16 -50 12 50 M920 834 l11 -34 8 34 M1010 830 l15 -46 11 46 M1100 836 l13 -40 10 40 M1190 830 l14 -44 10 44 M1280 836 l16 -48 12 48 M1380 830 l12 -36 9 36 M1480 836 l14 -42 10 42 L1600 900 Z"/>
  </g>

  <!-- Distant ground haze -->
  <rect x="0" y="760" width="1600" height="140" fill="#04070f" opacity="0.55"/>
</svg>
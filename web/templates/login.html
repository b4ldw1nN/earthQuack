<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>earthQuack · sign in</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="login-wrap">
    <header class="topbar">
      <span class="brand">earthQuack</span>
    </header>

    <section class="login-card">
      <h2>Authentication required</h2>
      <p class="muted">Enter the earthQuack token to access this node.</p>
      {{if .Error}}<p class="login-error" role="alert">Invalid token</p>{{end}}
      <form method="post" action="/login" autocomplete="off">
        <input type="password" name="token" placeholder="token" required
               autofocus autocapitalize="none" spellcheck="false">
        <button type="submit">Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>earthQuack · sign in</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="theme-night login-body">
  <main class="login-wrap">
    <div class="login-container">
      <header class="topbar login-brand-header">
        <div class="brand-logo-wrap">
          <svg class="brand-duck-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 9C12 5.13401 15.134 2 19 2C22.866 2 26 5.13401 26 9C26 10.5342 25.506 11.953 24.668 13.1042C26.549 14.1558 28.1634 15.6983 29.3516 17.5857C30.5398 19.4731 31.2562 21.6318 31.4297 23.8504C31.6031 26.0689 31.227 28.2618 30.3384 30.2134C29.4498 32.1649 28.084 33.8016 26.375 34.9622C24.666 36.1227 22.679 36.7628 20.6097 36.8197C18.5404 36.8767 16.4674 36.3484 14.5937 35.2866C12.72 34.2248 11.1166 32.6695 9.94095 30.7733C8.76534 28.877 8.06202 26.7118 7.90002 24.4907C7.81002 23.2507 7.92002 22.0207 8.23002 20.8307C6.88002 20.0807 5.75002 18.9807 4.96002 17.6307C4.17002 16.2807 3.75002 14.7307 3.75002 13.1507C3.75002 9.5607 6.44002 6.5507 10.02002 6.0907C10.60002 7.7807 11.75002 9.2207 13.27002 10.1507C12.47002 9.8707 12 9.1107 12 9Z" fill="url(#duck-grad)"/>
            <path d="M25 8.5C25 9.32843 24.3284 10 23.5 10C22.6716 10 22 9.32843 22 8.5C22 7.67157 22.6716 7 23.5 7C24.3284 7 25 7.67157 25 8.5Z" fill="#00e5ff"/>
            <path d="M26 10H32C33.1046 10 34 10.8954 34 12C34 13.1046 33.1046 14 32 14H24.5L26 10Z" fill="#ff9900"/>
            <defs>
              <linearGradient id="duck-grad" x1="4" y1="2" x2="32" y2="36" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38bdf8"/>
                <stop offset="1" stop-color="#1d4ed8"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-text-wrap">
          <span class="brand brand-title">earthQuack</span>
          <span class="brand-subtitle">Tailnet Node Monitor</span>
        </div>
      </header>

      <section class="login-card">
        <div class="login-card-header">
          <h2>Authentication required</h2>
          <p class="muted">Enter the earthQuack token to access this node.</p>
        </div>

        {{if .Error}}
        <div class="login-error-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <p class="login-error" role="alert">Invalid token</p>
        </div>
        {{end}}

        <form method="post" action="/login" autocomplete="off" class="login-form">
          <div class="input-field-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" name="token" placeholder="token" required
                   autofocus autocapitalize="none" spellcheck="false" class="login-input">
          </div>
          <button type="submit" class="login-submit-btn">
            <span>Sign in</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </form>
      </section>

      <footer class="login-footer">
        <p class="login-quote">&ldquo;Small machines. A more connected world.&rdquo;</p>
        <div class="login-meta">
          <span>v0.1.0</span>
          <span>·</span>
          <span>Tailnet Protected</span>
        </div>
      </footer>
    </div>
  </main>
</body>
</html>
